schema_version: 1
campaign_id: m4-validation-screen-v1
stage: screen
description: Three-pair validation-only screen with two predeclared compact CP-rank children.
claim_eligible: false
implementation_policy:
  require_clean_head: true
  require_committed_inputs: true
  require_external_output_root: true
  deterministic_algorithms: true
  intraop_threads: 1
  interop_threads: 1
task:
  num_surface_keys: 5
  value_cardinality: 4
  branches: 3
  max_live_bindings: 3
  min_length: 10
  max_length: 2048
  heldout_key_value_pairs:
    - [0, 0]
  global_distractor_probability: 0.5
models:
  - model_id: routed-oracle
    family: routed
    role: trainable_source
    routing_mode: oracle
    parent_model_id: null
    architecture:
      d_model: 16
      cp_rank: 8
      router_hidden_dim: 12
      scale_feature_dim: 8
      straight_through_route_surrogate: true
      curriculum_seed: 0
      schedule: null
    export: null
  - model_id: routed-source
    family: routed
    role: trainable_source
    routing_mode: curriculum
    parent_model_id: null
    architecture:
      d_model: 16
      cp_rank: 8
      router_hidden_dim: 12
      scale_feature_dim: 8
      straight_through_route_surrogate: true
      curriculum_seed: 2701
      schedule:
        start_step: 0
        end_step: 256
        start_probability: 1.0
        end_probability: 0.0
    export: null
  - model_id: routed-latent
    family: routed
    role: trainable_source
    routing_mode: latent
    parent_model_id: null
    architecture:
      d_model: 16
      cp_rank: 8
      router_hidden_dim: 12
      scale_feature_dim: 8
      straight_through_route_surrogate: true
      curriculum_seed: 0
      schedule: null
    export: null
  - model_id: routed-compact-r2
    family: routed
    role: derived_compact
    routing_mode: curriculum
    parent_model_id: routed-source
    architecture:
      d_model: 16
      cp_rank: 2
      router_hidden_dim: 12
      scale_feature_dim: 8
      straight_through_route_surrogate: true
      curriculum_seed: 2701
      schedule:
        start_step: 0
        end_step: 256
        start_probability: 1.0
        end_probability: 0.0
    export:
      selection_method: parameter_energy_v1
      target_cp_rank: 2
  - model_id: routed-compact-r4
    family: routed
    role: derived_compact
    routing_mode: curriculum
    parent_model_id: routed-source
    architecture:
      d_model: 16
      cp_rank: 4
      router_hidden_dim: 12
      scale_feature_dim: 8
      straight_through_route_surrogate: true
      curriculum_seed: 2701
      schedule:
        start_step: 0
        end_step: 256
        start_probability: 1.0
        end_probability: 0.0
    export:
      selection_method: parameter_energy_v1
      target_cp_rank: 4
  - model_id: gru-control
    family: gru
    role: trainable_source
    routing_mode: null
    parent_model_id: null
    architecture:
      d_model: 16
      hidden_dim: 32
      num_layers: 1
    export: null
  - model_id: transformer-control
    family: cached_transformer
    role: trainable_source
    routing_mode: null
    parent_model_id: null
    architecture:
      d_model: 16
      num_heads: 4
      num_layers: 2
      ff_dim: 32
    export: null
  - model_id: ttn-control
    family: causal_ttn
    role: trainable_source
    routing_mode: null
    parent_model_id: null
    architecture:
      d_model: 16
      cp_rank: 8
      scale_feature_dim: 8
    export: null
pairs:
  - pair_id: screen-pair-1
    model_seed: 2101
    train_seed: 2201
    validation_seed: 2301
    statistics_seed: 2401
  - pair_id: screen-pair-2
    model_seed: 2102
    train_seed: 2202
    validation_seed: 2302
    statistics_seed: 2402
  - pair_id: screen-pair-3
    model_seed: 2103
    train_seed: 2203
    validation_seed: 2303
    statistics_seed: 2403
data:
  generator_version: binding-v1
  train:
    batch_size: 4
    length_schedule: [10, 12, 16, 18]
    deterministic_step_stream: true
  validation:
    lengths: [16, 32, 64, 128, 256]
    episodes_per_length: 64
training:
  optimizer: adamw
  learning_rate: 0.005
  weight_decay: 0.0
  max_gradient_norm: 5.0
  optimizer_steps: 512
  train_token_budget: 28672
  checkpoint_interval: 128
  dtype: float32
  device: cpu
quality:
  primary_reference_model_id: routed-source
  metric: macro_length_query_accuracy
  max_absolute_drop: 0.05
  operational_rule: mean_paired_delta_gte_negative_margin
  claim_rule: one_sided_95pct_lower_bound_gt_negative_margin
statistics:
  paired_unit: pair_id
  confidence_level: 0.95
  method: paired_exact_empirical_bootstrap_n3_v1
  resamples: 27
runtime:
  semantics: batch1_full_document_streaming
  warmups: 3
  timed_iterations: 20
  process_repetitions: 3
  raw_samples_required: true
  condition: operational_quality_gate
screen_gates:
  chance: 0.25
  oracle_mean_min: 0.80
  reference_mean_min: 0.70
  reference_pair_min: 0.60
  reference_heldout_mean_min: 0.60
  reference_longest_length_mean_min: 0.60
  chance_corrected_oracle_recovery_min: 0.80
  oracle_max_drop_vs_reference: 0.02
  candidate_pair_max_drop: 0.10
  require_positive_query_partitions: true
  require_no_route_collapse: true
selection:
  candidates_by_stratum:
    routed_latent:
      - routed-latent
    routed_compact_rank:
      - routed-compact-r2
      - routed-compact-r4
    gru:
      - gru-control
    cached_transformer:
      - transformer-control
    causal_ttn:
      - ttn-control
  primary_metric: macro_length_query_accuracy
  direction: maximize
  standard_tie_break:
    - smaller_parameter_count
    - lexical_candidate_id
  compact_tie_break:
    - smaller_parameter_count
    - smaller_target_cp_rank
    - higher_primary_metric
    - lexical_candidate_id
