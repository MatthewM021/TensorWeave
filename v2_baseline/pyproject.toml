[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tnlm-v2"
version = "2.0.0"
description = "Predictive-geometry tensor-network language-model benchmark"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
tnlm-v2 = "tnlm_v2.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
