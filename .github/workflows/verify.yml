name: Verify handoff and V2 baseline
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python VERIFY_REPOSITORY.py
      - run: python -m pip install -e './v2_baseline[test]'
      - run: pytest -q v2_baseline/tests
